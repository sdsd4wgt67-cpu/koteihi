<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="固定費帳">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>くらしの固定費帳</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#EDF0F3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Barlow+Semi+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --font:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  --num:"Barlow Semi Condensed","Zen Kaku Gothic New","Hiragino Sans",system-ui,sans-serif;
  --bg:#EDF0F3;--surface:#FFFFFF;--ink:#17202B;--muted:#5A6573;--line:#D9DFE6;
  --accent:#1D4ED8;--accent-ink:#FFFFFF;--danger:#C62828;
  --meter-bg:#17202B;--meter-ink:#F3F6F9;--meter-tile:rgba(255,255,255,.09);--meter-red:#E5484D;
  --c-elec:#C98A00;--c-gas:#2563EB;--c-water:#0891A1;--c-net:#7C4DDB;--c-sub:#C2367A;--c-other:#6B7684;
  --up:#C2410C;--down:#15803D;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E131A;--surface:#171E27;--ink:#E6EBF1;--muted:#94A0AE;--line:#273140;
    --accent:#6E95FF;--accent-ink:#0B1020;--danger:#FF6B6B;
    --meter-bg:#06090D;--meter-ink:#EEF2F6;--meter-tile:rgba(255,255,255,.07);--meter-red:#FF5C61;
    --c-elec:#F2B32B;--c-gas:#6C9BFF;--c-water:#2EC4D3;--c-net:#A788FF;--c-sub:#F06CA8;--c-other:#9AA5B2;
    --up:#FB923C;--down:#4ADE80;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E131A;--surface:#171E27;--ink:#E6EBF1;--muted:#94A0AE;--line:#273140;
  --accent:#6E95FF;--accent-ink:#0B1020;--danger:#FF6B6B;
  --meter-bg:#06090D;--meter-ink:#EEF2F6;--meter-tile:rgba(255,255,255,.07);--meter-red:#FF5C61;
  --c-elec:#F2B32B;--c-gas:#6C9BFF;--c-water:#2EC4D3;--c-net:#A788FF;--c-sub:#F06CA8;--c-other:#9AA5B2;
  --up:#FB923C;--down:#4ADE80;color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:560px;margin:0 auto;padding:12px 16px calc(110px + env(safe-area-inset-bottom,0px))}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0 14px}
.brand{font-size:14px;font-weight:700;color:var(--muted);letter-spacing:.04em}
.mnav{display:flex;align-items:center;gap:4px}
.mnav b{font-size:17px;font-weight:700;min-width:7.2em;text-align:center}
.iconbtn{width:40px;height:40px;border:0;border-radius:12px;background:transparent;display:grid;place-items:center}
.iconbtn:hover{background:var(--surface)}
.iconbtn:disabled{opacity:.3;cursor:default;background:transparent}

/* meter */
.meter{background:var(--meter-bg);color:var(--meter-ink);border-radius:20px;padding:18px 18px 16px}
.meter-cap{font-size:13px;opacity:.7;margin:0 0 10px}
.digits{display:flex;align-items:center;flex-wrap:wrap;gap:4px;font-family:var(--num);font-variant-numeric:tabular-nums}
.yen{font-size:24px;font-weight:500;margin-right:6px;opacity:.8}
.d{display:inline-grid;place-items:center;width:1.02em;height:1.36em;border-radius:7px;background:var(--meter-tile);font-size:clamp(32px,10.5vw,46px);font-weight:600;line-height:1;box-shadow:inset 0 -1px 0 rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.06)}
.d.red{background:var(--meter-red);color:#fff}
.sep{font-size:28px;opacity:.45;width:.28em;text-align:center;align-self:flex-end;padding-bottom:4px}
.cmps{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.12)}
.cmp{display:flex;flex-direction:column;gap:1px}
.cmp-l{font-size:12px;opacity:.65}
.cmp-v{font-family:var(--num);font-size:21px;font-weight:600;font-variant-numeric:tabular-nums}
.cmp-v.up{color:#FFA36B}.cmp-v.down{color:#7BE3A0}.cmp-v.none{font-family:var(--font);font-size:14px;font-weight:500;opacity:.6;padding-top:4px}
.cmp-p{font-size:12px;opacity:.7;font-variant-numeric:tabular-nums}

/* sections */
.sec{margin-top:26px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:0 0 10px}
.sec-h h2{font-size:15px;font-weight:700;margin:0}
.sec-h .sub{font-size:13px;color:var(--muted)}
.panel{background:var(--surface);border-radius:16px;padding:4px 14px}

.bar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--line);gap:2px}
.bar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:13px}
.legend span{display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
.legend b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}
.dot{width:9px;height:9px;border-radius:3px;display:inline-block}

.row{display:flex;align-items:center;gap:12px;width:100%;padding:12px 0;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left}
.panel .row:last-child{border-bottom:0}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column}
.row-t{font-weight:500;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.row-s{font-size:13px;color:var(--muted)}
.row-amt{font-family:var(--num);font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.row.off{opacity:.55}
.tag{font-size:11px;font-weight:500;padding:1px 7px;border-radius:999px;background:var(--bg);color:var(--muted)}

.ic{color:var(--c);position:relative;width:38px;height:38px;flex:none;border-radius:11px;display:grid;place-items:center}
.ic::before{content:"";position:absolute;inset:0;border-radius:inherit;background:currentColor;opacity:.13}
.ic svg{position:relative}

.todo{display:flex;flex-wrap:wrap;gap:8px}
.todo button{display:inline-flex;align-items:center;gap:8px;border:1.5px dashed var(--line);background:var(--surface);border-radius:12px;padding:8px 12px 8px 8px;font-weight:500}
.todo .ic{width:28px;height:28px;border-radius:8px}
.todo button:hover{border-color:var(--accent)}

.empty{text-align:center;padding:28px 16px;color:var(--muted)}
.empty p{margin:0 0 14px}
.hero-empty{background:var(--surface);border-radius:20px;padding:28px 20px;margin-top:8px}
.hero-empty h1{font-size:21px;margin:0 0 8px;line-height:1.45}
.hero-empty p{color:var(--muted);margin:0 0 20px}
.stack{display:flex;flex-direction:column;gap:10px}

.banner{background:#FFF4D6;color:#5C4200;border-radius:12px;padding:10px 14px;font-size:14px;margin-bottom:12px}
.tip{font-size:13px;color:var(--muted);margin:10px 2px 0;line-height:1.7}

/* buttons */
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:700;min-height:48px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--bg);color:var(--ink)}
.btn.danger{background:transparent;color:var(--danger);padding-left:6px;padding-right:6px;margin-right:auto}
.btn.wide{width:100%}
.btn.small{min-height:36px;padding:6px 12px;font-size:14px;border-radius:10px}
.btn:active{transform:translateY(1px)}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:6px 12px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr auto 1fr 1fr;align-items:center}
.tab{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:6px 0}
.tab[aria-current="page"]{color:var(--ink);font-weight:700}
.rec-btn{border:0;background:var(--accent);color:var(--accent-ink);border-radius:50%;width:62px;height:62px;margin:-18px 6px 0;font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;box-shadow:0 8px 18px -8px var(--accent)}

/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:50;background:rgba(8,12,18,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:calc(100% - 24px - env(safe-area-inset-top,0px));overflow:auto;-webkit-overflow-scrolling:touch;border-radius:22px 22px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (min-width:700px){.sheet-wrap{align-items:center}.sheet{border-radius:22px}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet h2{font-size:19px;margin:0 0 16px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field>span{font-size:13px;font-weight:500;color:var(--muted)}
.field input,.field select{width:100%;min-height:48px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface);font-size:16px}
.field input:focus,.field select:focus{border-color:var(--accent);outline:none}
.money{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:12px;padding-left:14px;background:var(--surface)}
.money:focus-within{border-color:var(--accent)}
.money span{font-family:var(--num);font-weight:600;color:var(--muted)}
.money input{border:0!important;min-height:48px}
.money.big span{font-size:26px}
.money.big input{font-family:var(--num);font-size:34px;font-weight:600;min-height:62px;font-variant-numeric:tabular-nums}
.unit-in{display:flex;align-items:center;gap:8px}
.unit-in span{color:var(--muted);min-width:2.5em}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.pick{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:500;line-height:1.3;text-align:center}
.pick.on{border-color:var(--accent);box-shadow:0 0 0 1.5px var(--accent) inset}
.svc-fixed{display:flex;align-items:center;gap:10px;font-weight:700;margin-bottom:16px}
.hint{font-size:14px;color:var(--muted);margin:-6px 0 14px;min-height:1px}
.hint b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}
.note{font-size:13px;background:var(--bg);border-radius:10px;padding:10px 12px;margin:0 0 16px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip input,.seg input{position:absolute;opacity:0;pointer-events:none}
.chip span{display:inline-flex;align-items:center;gap:5px;border:1.5px solid var(--line);border-radius:999px;padding:7px 12px;font-size:14px;cursor:pointer}
.chip input:checked+span{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.chip input:focus-visible+span,.seg input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.seg{display:flex;flex-direction:column;gap:6px}
.seg span{display:block;border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;font-size:15px;cursor:pointer}
.seg input:checked+span{border-color:var(--accent);box-shadow:0 0 0 1.5px var(--accent) inset;font-weight:700}
.switch{display:flex;align-items:center;gap:12px;margin-bottom:16px;font-size:15px;cursor:pointer}
.switch input{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;flex:none;cursor:pointer;transition:background .15s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{transform:translateX(18px)}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:8px;flex-wrap:wrap}

/* confirm & toast */
.confirm-wrap{position:fixed;inset:0;z-index:70;background:rgba(8,12,18,.55);display:grid;place-items:center;padding:24px}
.confirm{background:var(--surface);border-radius:18px;padding:20px;max-width:360px;width:100%}
.confirm p{margin:0 0 18px;line-height:1.7}
.confirm .actions .btn{flex:1}
.confirm .btn.danger-fill{background:var(--danger);color:#fff}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s;white-space:nowrap}
#toast.show{opacity:1}

.data-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border-radius:14px;padding:12px 14px}
.stat span{display:block;font-size:12px;color:var(--muted)}
.stat b{font-family:var(--num);font-size:24px;font-weight:600}

/* analysis */
body[data-tab="ana"] .wrap{max-width:1120px}
.ana-grid{display:grid;gap:14px}
@media (min-width:900px){.ana-grid{grid-template-columns:1fr 1fr}.span2{grid-column:1/-1}}
.card{background:var(--surface);border-radius:16px;padding:16px;min-width:0}
.card h3{font-size:15px;margin:0 0 4px}
.card .cap{font-size:13px;color:var(--muted);margin:0 0 12px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (min-width:900px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--surface);border-radius:14px;padding:12px 14px}
.kpi span{display:block;font-size:12px;color:var(--muted)}
.kpi b{display:block;font-family:var(--num);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.3}
.kpi small{font-size:12px;color:var(--muted)}
.kpi small.up{color:var(--up)}.kpi small.down{color:var(--down)}
svg.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--muted);font-size:11px;font-family:var(--num)}
.chart .axsel{fill:var(--ink);font-weight:600}
.chart .hit{fill:transparent}
.chart .bar-g{cursor:pointer}
.chart .bar-g.sel .hit{fill:var(--accent);opacity:.09}
.chart .ly{fill:none;stroke:var(--ink);stroke-width:1.5;stroke-dasharray:4 4;opacity:.5}
.chart .lyd{fill:var(--surface);stroke:var(--ink);stroke-width:1.5;opacity:.6}
.chart .pl{fill:none;stroke:var(--accent);stroke-width:2.2}
.chart .pld{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.chart-legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:8px}
.chart-legend span{display:inline-flex;align-items:center;gap:6px}
.ln{width:18px;height:0;border-top:2px dashed var(--ink);opacity:.5;display:inline-block}
.ln.solid{border-top:2px solid var(--accent);opacity:1}
.mini{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.mini td,.mini th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.mini td:first-child,.mini th:first-child{text-align:left;white-space:normal}
.mini th{font-size:12px;font-weight:500;color:var(--muted)}
.mini tr:last-child td{border-bottom:0}
.mini tfoot td{font-weight:700;border-top:1.5px solid var(--ink);border-bottom:0}
.mini .up{color:var(--up)}.mini .down{color:var(--down)}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
.mx{border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.mx th,.mx td{padding:7px 10px;text-align:right;border-bottom:1px solid var(--line)}
.mx th{font-weight:500;color:var(--muted);font-size:12px}
.mx th:first-child,.mx td:first-child{text-align:left;position:sticky;left:0;background:var(--surface)}
.mx tr.sum td{font-weight:700;border-bottom:0}
.mx td.zero{color:var(--muted)}
.inline-fields{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.inline-fields input,.inline-fields select{min-height:42px;border:1.5px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--surface);font-size:16px}
.inline-fields .vs{color:var(--muted);font-size:13px}
.period{display:flex;align-items:center;gap:4px}
.period b{font-size:15px;font-weight:700;text-align:center;min-width:12em}
html:not(.ok){visibility:hidden}
</style>
</head>
<body>
<div class="wrap">
  <div id="banner"></div>
  <main id="view"></main>
</div>

<nav class="tabs" aria-label="メインメニュー">
  <div class="tabs-in">
    <button class="tab" data-act="tab" data-tab="home">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11 12 4l9 7"/><path d="M5.5 9.5V20h13V9.5"/></svg>
      ホーム
    </button>
    <button class="tab" data-act="tab" data-tab="ana">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 20h18"/><path d="M6.5 16v-5M11.5 16V5M16.5 16V9"/></svg>
      分析
    </button>
    <button class="rec-btn" data-act="add" aria-label="料金を記録する">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      記録
    </button>
    <button class="tab" data-act="tab" data-tab="manage">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6h.01M4 12h.01M4 18h.01"/></svg>
      サービス
    </button>
    <button class="tab" data-act="tab" data-tab="data">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v11"/><path d="m7.5 10 4.5 4.5 4.5-4.5"/><path d="M5 20h14"/></svg>
      データ
    </button>
  </div>
</nav>

<div id="sheetWrap" class="sheet-wrap" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
</div>
<div id="confirmWrap" class="confirm-wrap" hidden>
  <div class="confirm" role="alertdialog" aria-modal="true">
    <p id="confirmMsg"></p>
    <div class="actions">
      <button class="btn ghost" id="confirmNo">キャンセル</button>
      <button class="btn primary" id="confirmYes">OK</button>
    </div>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="importFile" accept=".json,application/json" hidden>

<script src="app.js"></script>
</body>
</html>
